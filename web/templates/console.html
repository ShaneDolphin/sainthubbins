<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Saint Hubbins — Live Console</title>
<style>body{font-family:monospace;background:#111;color:#eee;padding:20px}textarea{width:100%;height:150px;background:#222;color:#eee;border:1px solid #444}footer{margin-top:24px;font-size:12px;color:#888}footer em{color:#b5a46a}</style>
</head>
<body>
<h1>Saint Hubbins — Live Console</h1>
<textarea id="code">s("bd sd")</textarea>
<button onclick="go()">Go</button>
<pre id="out"></pre>
<footer><em>Stonehenge — 18" edition</em> — Nigel would be proud. These go to eleven.</footer>
<script>
async function go(){
  const code=document.getElementById('code').value;
  const r=await fetch('/api/evaluate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
  const j=await r.json();
  document.getElementById('out').textContent=JSON.stringify(j,null,2);
}
</script>
</body>
</html>
