linters:
  enable:
    - govet
    - errcheck
  disable:
    - unused
    - staticcheck
    - ineffassign
    - gosimple
linters-settings:
  errcheck:
    exclude-functions:
      - (net/http.ResponseWriter).Write
      - (*net/http.ResponseWriter).Write
      - (*html/template.Template).Execute
      - (*encoding/json.Encoder).Encode
      - (os.File).Write
      - (encoding/binary).Write
      - (os.File).Read
      - (codeberg.org/uzu/saint-hubbins/internal/io.MIDIInterface).SendNoteOn
      - (codeberg.org/uzu/saint-hubbins/internal/io.MIDIInterface).SendNoteOff
